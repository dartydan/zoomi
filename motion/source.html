<meta charset="utf-8">
<title>What Zoomi Does</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Oswald:wght@400;700&display=block">
<style>
:root { --bg: #141210; --bar: #1f1c19; --fg: #f3efe5; --muted: #a59d90; --accent: #d4503a; color-scheme: dark; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 "Oswald", "Arial Narrow", sans-serif; display: flex; flex-direction: column; }
.stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); }
canvas { max-width: 100%; max-height: 100%; aspect-ratio: 16 / 9; width: auto; height: auto; background: #f0e9d9; display: block; }
.bar { display: flex; align-items: center; gap: 12px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: var(--bar); }
button { font: 700 13px/1 "Oswald", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--fg); background: transparent; border: 1.5px solid var(--muted); padding: 7px 12px; cursor: pointer; }
button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
.time { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 7.5em; text-align: right; }
</style>
<div class="stage"><canvas id="cv" width="1280" height="720" aria-label="What Zoomi does, animated explainer"></canvas></div>
<div class="bar">
  <button id="play" type="button">Play</button>
  <input id="scrub" type="range" min="0" max="1000" value="0" step="1" aria-label="Scrub">
  <span class="time" id="time">0.0 / 0.0 s</span>
  <button id="snd" type="button" aria-pressed="true">Sound on</button>
  <button id="loop" type="button" aria-pressed="true">Loop</button>
</div>
<script>
// Shared helpers + style registry for the style-frame explorations.
// Every style is a pure function of time: draw(ctx, W, H, t). Same t => same pixels.
(function () {
  const STYLES = (window.STYLES = window.STYLES || []);
  window.registerStyle = (s) => STYLES.push(s);

  const H = (window.H = {});

  // ---------- seeded randomness ----------
  // H.rng(seed) -> r() in [0,1). Extras: r.range(a,b), r.int(a,b), r.pick(arr), r.gauss(), r.chance(p)
  H.rng = function (seed = 1) {
    let a = typeof seed === 'string' ? hashStr(seed) : (seed >>> 0) || 1;
    const r = function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    r.range = (lo, hi) => lo + r() * (hi - lo);
    r.int = (lo, hi) => Math.floor(lo + r() * (hi - lo + 1));
    r.pick = (arr) => arr[Math.floor(r() * arr.length)];
    r.chance = (p) => r() < p;
    r.gauss = () => { let u = 0, v = 0; while (!u) u = r(); while (!v) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
    return r;
  };
  function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

  // ---------- gradient noise ----------
  // H.makeNoise(seed) -> { n2(x,y), n3(x,y,z), fbm2(x,y,oct), fbm3(x,y,z,oct) }  (outputs roughly -1..1)
  H.makeNoise = function (seed = 1) {
    const r = H.rng(seed), p = new Uint8Array(512), perm = [...Array(256).keys()];
    for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]]; }
    for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
    const fade = (t) => t * t * t * (t * (t * 6 - 15) + 10);
    const lerp = (a, b, t) => a + (b - a) * t;
    const g3 = (h, x, y, z) => { h &= 15; const u = h < 8 ? x : y, v = h < 4 ? y : h === 12 || h === 14 ? x : z; return ((h & 1) ? -u : u) + ((h & 2) ? -v : v); };
    function n3(x, y, z) {
      const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
      x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
      const u = fade(x), v = fade(y), w = fade(z);
      const A = p[X] + Y, AA = p[A] + Z, AB = p[A + 1] + Z, B = p[X + 1] + Y, BA = p[B] + Z, BB = p[B + 1] + Z;
      return lerp(lerp(lerp(g3(p[AA], x, y, z), g3(p[BA], x - 1, y, z), u), lerp(g3(p[AB], x, y - 1, z), g3(p[BB], x - 1, y - 1, z), u), v),
        lerp(lerp(g3(p[AA + 1], x, y, z - 1), g3(p[BA + 1], x - 1, y, z - 1), u), lerp(g3(p[AB + 1], x, y - 1, z - 1), g3(p[BB + 1], x - 1, y - 1, z - 1), u), v), w);
    }
    const n2 = (x, y) => n3(x, y, 0.5);
    const fbm3 = (x, y, z, oct = 4) => { let s = 0, a = 0.5, f = 1, norm = 0; for (let i = 0; i < oct; i++) { s += a * n3(x * f, y * f, z * f); norm += a; a *= 0.5; f *= 2; } return s / norm; };
    const fbm2 = (x, y, oct = 4) => fbm3(x, y, 0.5, oct);
    return { n2, n3, fbm2, fbm3 };
  };

  // ---------- math ----------
  H.lerp = (a, b, t) => a + (b - a) * t;
  H.clamp = (v, lo = 0, hi = 1) => Math.max(lo, Math.min(hi, v));
  H.map = (v, a, b, c, d) => c + ((v - a) / (b - a)) * (d - c);
  H.smooth = (e0, e1, x) => { const t = H.clamp((x - e0) / (e1 - e0)); return t * t * (3 - 2 * t); };
  H.ease = {
    inOut: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
    out: (t) => 1 - Math.pow(1 - t, 3),
    in: (t) => t * t * t,
    back: (t) => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  };

  // ---------- color ----------
  H.hex = (h) => { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map((c) => c + c).join(''); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  H.rgba = (hexOrArr, a = 1) => { const [r, g, b] = Array.isArray(hexOrArr) ? hexOrArr : H.hex(hexOrArr); return `rgba(${r | 0},${g | 0},${b | 0},${a})`; };
  H.mix = (c1, c2, t) => { const a = Array.isArray(c1) ? c1 : H.hex(c1), b = Array.isArray(c2) ? c2 : H.hex(c2); return [0, 1, 2].map((i) => a[i] + (b[i] - a[i]) * t); };

  // ---------- canvas utilities ----------
  // Offscreen canvas of the same logical size (use for layers, masks, compositing).
  H.layer = (W, H_, ) => { const c = document.createElement('canvas'); c.width = W; c.height = H_; return c; };
  // Monochrome grain / film noise over the whole canvas. amount ~ 0.03-0.15
  H.grain = function (ctx, W, Hh, amount = 0.08, seed = 7, mono = true) {
    const img = ctx.getImageData(0, 0, ctx.canvas.width, ctx.canvas.height), d = img.data, r = H.rng(seed), k = amount * 255;
    for (let i = 0; i < d.length; i += 4) {
      const n = (r() - 0.5) * k;
      if (mono) { d[i] += n; d[i + 1] += n; d[i + 2] += n; }
      else { d[i] += (r() - 0.5) * k; d[i + 1] += (r() - 0.5) * k; d[i + 2] += (r() - 0.5) * k; }
    }
    ctx.putImageData(img, 0, 0);
  };
  // Paper-ish texture tile: fills with base color + fibrous noise (cheap; drawn into ctx).
  H.paper = function (ctx, W, Hh, base = '#f3ecdc', seed = 3, strength = 0.06) {
    ctx.save(); ctx.fillStyle = base; ctx.fillRect(0, 0, W, Hh);
    const nz = H.makeNoise(seed), cell = 4, [br, bg, bb] = H.hex(base);
    for (let y = 0; y < Hh; y += cell) for (let x = 0; x < W; x += cell) {
      const v = nz.fbm2(x * 0.01, y * 0.01, 3) * 0.6 + nz.n2(x * 0.15, y * 0.04) * 0.4;
      const s = 1 + v * strength * 2;
      ctx.fillStyle = `rgb(${br * s | 0},${bg * s | 0},${bb * s | 0})`; ctx.fillRect(x, y, cell, cell);
    }
    ctx.restore();
  };
  // Vignette
  H.vignette = function (ctx, W, Hh, strength = 0.5, color = '0,0,0') {
    const g = ctx.createRadialGradient(W / 2, Hh / 2, Math.min(W, Hh) * 0.3, W / 2, Hh / 2, Math.hypot(W, Hh) * 0.6);
    g.addColorStop(0, `rgba(${color},0)`); g.addColorStop(1, `rgba(${color},${strength})`);
    ctx.save(); ctx.fillStyle = g; ctx.fillRect(0, 0, W, Hh); ctx.restore();
  };

  // ---------- rendering entry ----------
  // Renders style into canvas at logical 1280x720 (canvas can be any pixel size; it is scaled).
  H.W = 1280; H.H = 720;
  H.loadFonts = async function (style) {
    const specs = style.fonts || [];
    try { const sample = 'AaZz09' + (window.FONT_SAMPLE || '');
      await Promise.all(specs.map((f) => document.fonts.load(f, sample))); await document.fonts.ready; } catch (e) { /* render anyway */ }
  };
  H.render = function (style, canvas, t) {
    const ctx = canvas.getContext('2d', { willReadFrequently: !!style.readsPixels });
    const sx = canvas.width / H.W, sy = canvas.height / H.H;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save(); ctx.scale(sx, sy);
    style.draw(ctx, H.W, H.H, t == null ? style.frameT || 0 : t);
    ctx.restore();
  };
})();

// sound.js: a small synthesized sound kit for the style explainers. Plain Web Audio, no audio files.
// Voiceover mode: SOUND.kit(ctx, { voiceover: true }) drops beds and music, plays anything marked minor
// (play(..., { minor: true }), tone/noise { minor: true }, or scheduled inside k.withMinor(() => ...)) at about 60%
// volume instead of full, and sits all effects a little lower, so the narration stays on top while the piece still
// sounds alive. In the full mix, minor sounds play at full volume. Scores can read k.vo to branch further.
// A style adds   explainerSound(k) { k.bed('room', 0, D); k.play('pop', 1.25); ... }   and the same
// call schedules into a live AudioContext (the player) or an OfflineAudioContext (the video render).
// Times are seconds on the explainer's own clock. Randomness is seeded, so every render is identical.
(function () {
  'use strict';
  const SOUND = (window.SOUND = {});
  const TINY = 1e-4;

  // seeded random in [0,1), keyed by any string
  function rand(key) {
    let h = 2166136261;
    for (let i = 0; i < key.length; i++) { h ^= key.charCodeAt(i); h = Math.imul(h, 16777619); }
    let a = h >>> 0 || 1;
    return () => { a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }

  // note names to Hz: 'A4' = 440, 'C#5', 'Eb3'
  const STEP = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  function hz(n) {
    if (typeof n === 'number') return n;
    const m = /^([A-G])([#b]?)(-?\d)$/.exec(n);
    const semis = STEP[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (Number(m[3]) - 4) * 12 - 9;
    return 440 * Math.pow(2, semis / 12);
  }
  SOUND.hz = hz;

  SOUND.kit = function (ctx, opts) {
    const o = opts || {};
    const VO = !!o.voiceover;
    const MINOR = 0.6; // voiceover-mode volume for minor sounds
    let inMinor = false;
    const gainOf = (p, d) => (p.gain == null ? d : p.gain) * (VO && (p.minor || inMinor) ? MINOR : 1);
    const T0 = (o.start || 0) - 0; // explainer time that maps to ctx time `base`
    const base = ctx.currentTime + (o.delay || 0);
    // Start times snap to the sample grid (+ a quarter sample): in Chrome a source started a hair off the grid can
    // spike to about twice its set level.
    const SR = ctx.sampleRate;
    const at = (t) => (Math.round((base + (t - T0)) * SR) + 0.25) / SR;

    // ---- buses: sfx, amb, music -> compressor -> master; one shared reverb send
    const master = ctx.createGain(); master.gain.value = o.master == null ? 0.9 : o.master;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 8; comp.ratio.value = 3; comp.attack.value = 0.004; comp.release.value = 0.18;
    comp.connect(master); master.connect(o.dest || ctx.destination);
    const bus = {};
    for (const [name, g] of Object.entries({ sfx: VO ? 0.7 : 0.85, amb: 0.5, music: 0.45 })) { bus[name] = ctx.createGain(); bus[name].gain.value = g; bus[name].connect(comp); }

    // generated room reverb: decaying stereo noise, darker toward the tail
    const verb = ctx.createConvolver();
    {
      const secs = 1.6, n = Math.floor(secs * ctx.sampleRate), ir = ctx.createBuffer(2, n, ctx.sampleRate);
      for (let c = 0; c < 2; c++) {
        const r = rand('verb' + c), d = ir.getChannelData(c); let lp = 0;
        for (let i = 0; i < n; i++) { const u = i / n; lp += (0.6 - 0.45 * u) * ((r() * 2 - 1) - lp); d[i] = lp * Math.pow(1 - u, 3); }
      }
      verb.buffer = ir;
    }
    const verbIn = ctx.createGain(); verbIn.gain.value = 0.9; verbIn.connect(verb); verb.connect(comp);

    // seeded noise buffers: white, pink-ish and brown
    const noiseBuf = {};
    {
      const n = Math.floor(2.5 * ctx.sampleRate);
      for (const kind of ['white', 'pink', 'brown']) {
        const b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0), r = rand('noise-' + kind);
        let p0 = 0, p1 = 0, p2 = 0, br = 0;
        for (let i = 0; i < n; i++) {
          const w = r() * 2 - 1;
          if (kind === 'white') d[i] = w;
          else if (kind === 'pink') { p0 = 0.997 * p0 + 0.029 * w; p1 = 0.985 * p1 + 0.032 * w; p2 = 0.95 * p2 + 0.048 * w; d[i] = (p0 + p1 + p2 + w * 0.05) * 2.2; }
          else { br = (br + 0.02 * w) / 1.02; d[i] = br * 3.2; }
        }
        noiseBuf[kind] = b;
      }
    }

    // ---- automation helpers
    // a value or [[dt, value], ...] from the voice start; ramps are exponential (frequencies)
    function sweep(param, v, t) {
      if (!Array.isArray(v)) { param.setValueAtTime(v, t); return; }
      param.setValueAtTime(v[0][1], t + v[0][0]);
      for (let i = 1; i < v.length; i++) param.exponentialRampToValueAtTime(Math.max(v[i][1], 1), t + v[i][0]);
    }
    // amplitude: linear attack to `gain`, optional hold, exponential release to silence by `dur`
    function shape(param, t, gain, dur, a, hold) {
      a = Math.min(a == null ? 0.004 : a, dur * 0.9);
      hold = Math.min(hold || 0, dur - a);
      param.setValueAtTime(0, t);
      param.linearRampToValueAtTime(gain, t + a);
      if (hold > 0) param.setValueAtTime(gain, t + a + hold);
      param.exponentialRampToValueAtTime(TINY, t + dur);
      param.setValueAtTime(0, t + dur + 0.001);
    }
    function out(node, p) {
      const pan = ctx.createStereoPanner(); pan.pan.value = Math.max(-1, Math.min(1, p.pan || 0));
      node.connect(pan); pan.connect(bus[p.bus || 'sfx']);
      if (p.verb) { const s = ctx.createGain(); s.gain.value = p.verb; pan.connect(s); s.connect(verbIn); }
    }
    function filterNode(p, t) {
      if (!p.filter) return null;
      const f = ctx.createBiquadFilter(); f.type = p.filter; f.Q.value = p.q == null ? 1 : p.q;
      sweep(f.frequency, p.f == null ? 1000 : p.f, t);
      return f;
    }

    // ---- primitives
    // tone(t, { f, type, dur, gain, a, hold, pan, verb, bus, filter, f2 (filter freq), q, detune })
    function tone(time, p) {
      let t = at(time), dur = p.dur || 0.2;
      if (t + dur < ctx.currentTime || (time < T0 - 0.001 && dur < 1.5)) return;
      // a long sound already underway when playback resumes mid-score: start it now with its remaining length
      if (t < ctx.currentTime) { dur -= ctx.currentTime - t; t = ctx.currentTime; }
      const osc = ctx.createOscillator(); osc.type = p.type || 'sine';
      sweep(osc.frequency, Array.isArray(p.f) ? p.f.map(([d, v]) => [d, hz(v)]) : hz(p.f || 440), t);
      if (p.detune) osc.detune.value = p.detune;
      const g = ctx.createGain(); shape(g.gain, t, gainOf(p, 0.3), dur, p.a, p.hold);
      let node = osc;
      if (p.filter) { const f = ctx.createBiquadFilter(); f.type = p.filter; f.Q.value = p.q == null ? 0.8 : p.q; sweep(f.frequency, p.f2 || 2000, t); osc.connect(f); node = f; }
      node.connect(g); out(g, p);
      osc.start(t); osc.stop(t + dur + 0.02);
    }
    // noise(t, { dur, color, filter, f, q, gain, a, hold, pan, verb, bus, rate })
    function noise(time, p) {
      let t = at(time), dur = p.dur || 0.2;
      if (t + dur < ctx.currentTime || (time < T0 - 0.001 && dur < 1.5)) return;
      // a long sound already underway when playback resumes mid-score: start it now with its remaining length
      if (t < ctx.currentTime) { dur -= ctx.currentTime - t; t = ctx.currentTime; }
      const src = ctx.createBufferSource(); src.buffer = noiseBuf[p.color || 'white']; src.loop = true;
      if (p.rate) src.playbackRate.value = p.rate;
      const g = ctx.createGain(); shape(g.gain, t, gainOf(p, 0.3), dur, p.a, p.hold);
      const f = filterNode(p, t);
      if (f) { src.connect(f); f.connect(g); } else src.connect(g);
      out(g, p);
      const off = rand('off' + time + (p.f || ''))() * 2;
      src.start(t, off); src.stop(t + dur + 0.02);
    }

    // ---- named sounds. play(name, t, opts): opts.gain scales the whole sound, opts.pan places it.
    const S = {
      // UI / motion graphics
      pop: (t, o) => { tone(t, { f: [[0, o.f || 620], [0.07, (o.f || 620) * 0.45]], dur: 0.1, gain: 0.32 * o.g, pan: o.pan }); noise(t, { dur: 0.012, filter: 'highpass', f: 3000, gain: 0.12 * o.g, pan: o.pan }); },
      tick: (t, o) => noise(t, { dur: 0.018, filter: 'bandpass', f: o.f || 4200, q: 2.5, gain: 0.3 * o.g, pan: o.pan }),
      click: (t, o) => { tone(t, { f: o.f || 1900, type: 'square', dur: 0.02, gain: 0.08 * o.g, filter: 'lowpass', f2: 3000, pan: o.pan }); noise(t, { dur: 0.01, filter: 'highpass', f: 2500, gain: 0.15 * o.g, pan: o.pan }); },
      tock: (t, o) => { tone(t, { f: o.f || 820, dur: 0.07, gain: 0.25 * o.g, pan: o.pan }); noise(t, { dur: 0.05, filter: 'bandpass', f: o.f || 820, q: 9, gain: 0.35 * o.g, pan: o.pan }); },
      blip: (t, o) => tone(t, { f: o.f || 'E6', type: o.type || 'square', dur: o.dur || 0.07, gain: 0.07 * o.g, a: 0.002, hold: (o.dur || 0.07) * 0.6, pan: o.pan }),
      whoosh: (t, o) => { const d = o.dur || 0.45; noise(t, { dur: d, color: 'pink', filter: 'bandpass', f: [[0, 350], [d * 0.55, o.top || 2600], [d, 700]], q: 0.9, gain: 0.32 * o.g, a: d * 0.5, pan: o.pan, verb: 0.15 }); },
      swish: (t, o) => { const d = o.dur || 0.18; noise(t, { dur: d, filter: 'highpass', f: [[0, 1800], [d, 5200]], q: 0.7, gain: 0.22 * o.g, a: d * 0.35, pan: o.pan }); },
      riser: (t, o) => { const d = o.dur || 0.8; noise(t, { dur: d, color: 'pink', filter: 'bandpass', f: [[0, 300], [d, 4000]], q: 1.2, gain: 0.25 * o.g, a: d * 0.95, pan: o.pan, verb: 0.2 }); tone(t, { f: [[0, 180], [d, 720]], type: 'triangle', dur: d, gain: 0.06 * o.g, a: d * 0.9 }); },
      thud: (t, o) => { tone(t, { f: [[0, o.f || 130], [0.16, 42]], dur: 0.26, gain: 0.55 * o.g, pan: o.pan }); noise(t, { dur: 0.09, color: 'brown', filter: 'lowpass', f: 500, gain: 0.35 * o.g, pan: o.pan }); },
      impact: (t, o) => { S.thud(t, o); noise(t, { dur: 0.7, color: 'pink', filter: 'lowpass', f: [[0, 2400], [0.6, 300]], gain: 0.3 * o.g, verb: 0.35, pan: o.pan }); },
      stamp: (t, o) => { S.thud(t, { ...o, f: 160 }); noise(t, { dur: 0.05, filter: 'bandpass', f: 1300, q: 1.2, gain: 0.4 * o.g, pan: o.pan }); noise(t + 0.004, { dur: 0.012, filter: 'highpass', f: 3500, gain: 0.25 * o.g, pan: o.pan }); },
      ding: (t, o) => { const f = hz(o.f || 'E6'); tone(t, { f, dur: 1.3, gain: 0.2 * o.g, verb: 0.3, pan: o.pan }); tone(t, { f: f * 2.76, dur: 0.5, gain: 0.05 * o.g, verb: 0.3, pan: o.pan }); },

    // the pull-back reveals all three; the headline lands near the lens (almost screen-fixed)
    if (tq >= X.d1) { const A = arrive(tq, X.d1, 'drop'); place(c, cam, 0.15, 860 * 0.15 + 0, -300, -0.02 + A.r, A.s, (cc) => { drawSpr(cc, C.d1); hilite(cc, C.d1.hl, (t - X.hlD[0]) / (X.hlD[1] - X.hlD[0]), 7); }); }
  };

  // ---------- 3: it gets seen ----------
  const scene3 = (c, cam, t, tq) => {
    bgPaper(c, cam);
    block(c, cam, 0.55, 520, -40, 640, 900, 0, BLUE, 33, [0, 0, 0, 1]);
    place(c, cam, 0.45, -600, -330, -0.07, 0.8, (cc) => drawSpr(cc, C.clipSoft));
    place(c, cam, 0.85, -270, -40, -0.04, 0.96, (cc) => drawSpr(cc, C.shopOld));
    const sp = C.shopNew;
    putSpr(c, cam, 0.9, sp, -240, -20, 0.02, 1, tq, X.new3, 'drop', (cc) => {
      if (tq >= X.new3 + 0.15) { tape(cc, -sp.w / 2 + 26, -sp.h / 2 + 8, 110, 32, -0.5, 41); tape(cc, sp.w / 2 - 30, sp.h / 2 - 10, 104, 30, -0.45, 42); }
      marker(cc, loopPts(118, 80, 150, 95, 6.1), (tq - X.ring3[0]) / (X.ring3[1] - X.ring3[0]), RED, 7);
    });
    putSpr(c, cam, 0.95, C.clipB, 380, -50, 0.03, 0.95, tq, X.clipB, 'slideR', (cc) => {
      hilite(cc, C.clipB.hl, (t - X.hlB[0]) / (X.hlB[1] - X.hlB[0]), 9);
      if (tq >= X.clipB + 0.15) tape(cc, -20, -C.clipB.h / 2 + 2, 120, 32, -0.08, 43);
    });
    putSpr(c, cam, 1.1, C.s1, -180, 262, -0.018, 1, tq, X.s1, 'drop', (cc) => hilite(cc, C.s1.hl, (t - X.hlS[0]) / (X.hlS[1] - X.hlS[0]), 11));
    place(c, cam, 1.5, 690, 360, -0.3, 1, (cc) => drawSpr(cc, C.fg));
  };

  // ---------- 4: Zoomi Audit keeps it found ----------
  const RIVALS = [0, 1, 2, 3].map((i) => { const r = H.rng(170 + i); return [180 + r() * 150, 0.3 + r() * 0.12]; });
  const rankAt = (tq) => 5 - Math.min(4, Math.floor(H.clamp((tq - X.climb[0]) / (X.climb[1] - X.climb[0])) * 4 + 1e-6));
  const scene4 = (c, cam, t, tq) => {
    bgPaper(c, cam);
    block(c, cam, 0.55, 600, 340, 760, 300, 0.04, RED, 53, [1, 0, 0, 1], 8);
    block(c, cam, 0.5, -400, 0, 560, 900, 0, INK, 51, [0, 1, 0, 0]);
    place(c, cam, 0.45, 640, -350, -0.07, 0.8, (cc) => drawSpr(cc, C.clipSoft));
    const rank = rankAt(tq);
    putSpr(c, cam, 0.95, C.lab['ZOOMI AUDIT'], -420, -250, -0.03, 1, tq, X.sheet[0], 'drop');
    place(c, cam, 0.95, -420, -250, 0, 1, (cc) => { cc.fillStyle = CREAM; cc.font = '400 30px "Oswald"'; cc.fillText('OUR SEO SOFTWARE', -130, 70); });
    putSpr(c, cam, 1, C.numBg, -420, 20, 0.02, 1, tq, X.num, 'drop', (cc) => {
      cc.fillStyle = INK; cc.font = '400 172px "Anton"'; cc.textAlign = 'center'; cc.fillText('#' + rank, 0, 64); cc.textAlign = 'left';
      const m = measure('400 172px "Anton"', '#' + rank); hilite(cc, [-m.width / 2 - 14, -54, m.width + 28, 122], (t - X.hlNum[0]) / (X.hlNum[1] - X.hlNum[0]), 21);
      tape(cc, -150, -110, 80, 26, -0.4, 44);
    });
    putSpr(c, cam, 1, C.search, 240, -30, 0.012, 1, tq, X.sheet[0], 'drop', (cc) => {
      const slotY = (i) => -110 + i * 74;
      let k = 0;
      for (let i = 0; i < 5; i++) {
        if (i === rank - 1) continue;
        const [bw, v] = RIVALS[k++], y = slotY(i);
        cc.fillStyle = gs(v); cc.fillRect(-250, y - 12, bw, 14); greek(cc, -250, y + 16, 470, 2, 13, 180 + k);
      }
      const y = slotY(rank - 1);
      cc.save(); cc.shadowColor = 'rgba(40,28,15,0.3)'; cc.shadowBlur = 8; cc.shadowOffsetY = 3; cc.fillStyle = '#fbf8f0'; cc.fillRect(-268, y - 34, 536, 70); cc.restore();
      cc.fillStyle = RED; cc.fillRect(-268, y - 34, 8, 70);
      cc.fillStyle = INK; cc.font = '700 30px "Oswald"'; cc.fillText('Hartwell Precision', -246, y + 2);
      cc.fillStyle = 'rgba(40,36,32,0.8)'; cc.font = '400 17px "Oswald"'; cc.fillText('hartwellprecision.com  ·  CNC machining  ·  Indiana', -246, y + 26);
      hilite(cc, [-252, y - 28, 270, 40], (t - X.hlRow[0]) / (X.hlRow[1] - X.hlRow[0]), 23);
      if (tq >= X.sheet[0]) { tape(cc, -260, -215, 90, 26, -0.6, 45); tape(cc, 270, -210, 90, 26, 0.55, 46); }
      // climbing arrow beside the results
      if (tq >= X.climb[0]) inkArrow(cc, linePts(280, slotY(4) + 10, 280, y + 4, 47, 8, 1.5), 1, 3.2, RED);
    });
    putSpr(c, cam, 1.08, C.a1, -260, 262, -0.015, 1, tq, X.a1, 'drop', (cc) => hilite(cc, C.a1.hl, (t - X.hlA[0]) / (X.hlA[1] - X.hlA[0]), 13));
  };

  // ---------- 5: takeaway ----------
  const scene5 = (c, cam, t, tq) => {
    bgPaper(c, cam);
    place(c, cam, 0.45, 610, -330, 0.08, 0.8, (cc) => drawSpr(cc, C.clipSoft));
    block(c, cam, 0.6, -20, -20, 1060, 440, -0.02, RED, 61, [1, 1, 1, 1], 7);
    putSpr(c, cam, 0.85, C.shopNew, -560, -250, -0.1, 0.55, tq, 19, 'drop', (cc) => tape(cc, 0, -C.shopNew.h / 2 + 4, 110, 32, 0.12, 62));
    putSpr(c, cam, 0.85, C.poster, 590, 250, 0.09, 0.5, tq, 19, 'drop', (cc) => tape(cc, 0, -200, 100, 30, -0.1, 63));
    putSpr(c, cam, 1, C.k1, -60, -110, -0.02, 1, tq, X.k1, 'drop');
    putSpr(c, cam, 1, C.k2, -150, 60, 0.015, 1, tq, X.k2, 'drop', (cc) => hilite(cc, C.k2.hl, (t - X.hlK[0]) / (X.hlK[1] - X.hlK[0]), 31));
    place(c, cam, 1, 0, 0, 0, 1, (cc) => inkArrow(cc, quadPts(170, 120, 250, 210, 300, 228, 20), H.clamp((tq - X.arrK[0]) / (X.arrK[1] - X.arrK[0])), 6, INK));
    putSpr(c, cam, 1.05, C.url, 440, 240, -0.03, 1, tq, X.url, 'drop', (cc) => { if (tq >= X.url + 0.1) tape(cc, -90, -46, 70, 24, -0.4, 64); });
  };

  // camera: smooth (continuous t). Returns scene id + x,y,zoom.
  const camAt = (t) => {
    const e3 = (u) => u * u * u, cl = H.clamp, io = H.ease.inOut;
    if (t < X.whip1[1]) {
      const w = cl((t - X.whip1[0]) / (X.whip1[1] - X.whip1[0])), p = io(cl((t - X.push[0]) / (X.push[1] - X.push[0])));
      const z = H.lerp(1 + 0.03 * cl(t / 1.9), 1.36 + 0.04 * cl((t - X.push[1]) / 1.6), p);
      return { sc: 1, x: H.lerp(t * 8, 360, p) + 1150 * e3(w) / z, y: H.lerp(0, -30, p), z };
    }
    if (t < X.whip2[1]) {
      const w = cl((t - X.whip1[1]) / (X.whip1[2] - X.whip1[1]));
      const a = io(cl((t - X.pan1[0]) / (X.pan1[1] - X.pan1[0]))), b = io(cl((t - X.pan2[0]) / (X.pan2[1] - X.pan2[0]))), pl = io(cl((t - X.pull[0]) / (X.pull[1] - X.pull[0])));
      const tail = cl((t - X.whip2[0]) / (X.whip2[1] - X.whip2[0]));
      const x0 = a * 780 + b * 800 + (t - X.whip1[1]) * 9 - 1150 * Math.pow(1 - w, 3);
      const z = H.lerp(1.18 + 0.03 * cl((t - 4.3) / 6), 0.56, pl);
      return { sc: 2, x: H.lerp(x0, 860, pl), y: H.lerp(10, 0, pl) + 900 * e3(tail) / z, z };
    }
    if (t < X.sheet[1]) {
      const w = cl((t - X.whip2[1]) / (X.whip2[2] - X.whip2[1]));
      return { sc: 3, x: (t - 13) * 6, y: -900 * Math.pow(1 - w, 3), z: 1 + 0.05 * cl((t - 13) / 3.2) };
    }
    if (t < X.whip3[1]) {
      const w = cl((t - X.whip3[0]) / (X.whip3[1] - X.whip3[0])), e = io(cl((t - X.hlNum[0] + 0.15) / 0.5));
      const z = 1 + 0.03 * cl((t - 16.5) / 2) + 0.06 * e;
      return { sc: 4, x: H.lerp((t - 16.5) * 5, -60, e) + 1150 * e3(w) / z, y: 0, z };
    }
    const w = cl((t - X.whip3[1]) / (X.whip3[2] - X.whip3[1]));
    return { sc: 5, x: -1150 * Math.pow(1 - w, 3), y: 0, z: 1 + 0.045 * cl((t - 20) / 3) };
  };
  const SCENES = [null, scene1, scene2, scene3, scene4, scene5];

  const drawExplainer = (ctx, t) => {
    zinit();
    const tq = q12(t), cam = camAt(t);
    // whip blur from camera speed (screen px/s), measured within the same scene
    const ca = camAt(t - 0.006), cb = camAt(t + 0.006);
    const A = ca.sc === cam.sc ? ca : cam, B = cb.sc === cam.sc ? cb : cam, dt = (A === cam || B === cam) ? 0.006 : 0.012;
    const vx = (B.x - A.x) * cam.z / dt, vy = (B.y - A.y) * cam.z / dt, sp = Math.hypot(vx, vy), blur = H.clamp((sp - 700) / 420, 0, 22);
    const L = C.L || (C.L = H.layer(1280, 720)), L2 = C.L2 || (C.L2 = H.layer(1280, 720));
    const target = blur > 0.8 ? L.getContext('2d') : ctx;
    if (target !== ctx) { target.setTransform(1, 0, 0, 1, 0, 0); target.clearRect(0, 0, 1280, 720); }
    SCENES[cam.sc](target, cam, t, tq);
    // the next sheet slides up over the last scene on 12 fps steps
    if (cam.sc === 3 && tq >= X.sheet[0]) {
      const u = H.clamp((tq - X.sheet[0]) / (X.sheet[1] - X.sheet[0])), y = 780 * (1 - H.ease.out(u));
      target.save(); target.translate(0, y);
      const poly = edgePoly(1400, 800, [1, 0, 0, 0], 61, 9).map(([x, yy]) => [x + 640, yy + 400 + 6]);
      target.shadowColor = 'rgba(40,28,15,0.45)'; target.shadowBlur = 24; target.shadowOffsetY = -6; pathPoly(target, poly); target.fillStyle = PAPER; target.fill();
      target.shadowColor = 'transparent'; pathPoly(target, poly); target.clip();
      scene4(target, camAt(X.sheet[1]), t, tq);
      target.restore();
    }
    if (target !== ctx) {
      const l2 = L2.getContext('2d'); l2.setTransform(1, 0, 0, 1, 0, 0); l2.clearRect(0, 0, 1280, 720);
      l2.filter = `blur(${(blur * 0.35).toFixed(1)}px)`; l2.drawImage(L, 0, 0); l2.filter = 'none';
      const n = 7, ux = sp ? vx / sp : 1, uy = sp ? vy / sp : 0;
      ctx.save(); ctx.fillStyle = PAPER; ctx.fillRect(0, 0, 1280, 720);
      for (let i = 0; i < n; i++) { const o = (i / (n - 1) - 0.5) * blur * 2.6; ctx.globalAlpha = 1 / (i + 1); ctx.drawImage(L2, ux * o, uy * o); }
      ctx.restore();
    }
    finish(ctx, t, 0.24);
  };

  // ---------- sound: every time comes from X; stepped cutouts land 1 frame (1/12 s) after they appear ----------
  const scoreSound = (k) => {
    const LAND = 1 / 12, D = DURATION;
    const slide = (t, dur = 0.25, gain = 1, pan = 0, minor = false) => k.noise(t, { dur, color: 'pink', filter: 'lowpass', f: [[0, 420], [dur, 1100]], q: 0.7, gain: 0.2 * gain, a: dur * 0.35, pan, minor });
    const put = (t, gain = 1, pan = 0, minor = false) => {
      k.noise(t, { dur: 0.07, color: 'brown', filter: 'lowpass', f: 650, gain: 0.32 * gain, a: 0.002, pan, minor });
      k.tone(t, { f: [[0, 150], [0.07, 70]], dur: 0.09, gain: 0.1 * gain, pan, minor });
      k.noise(t + 0.004, { dur: 0.018, filter: 'bandpass', f: 1700, q: 0.9, gain: 0.07 * gain, pan, minor });
    };
    const hl = (a, b, gain = 1, pan = 0, minor = false) => {
      const d = b - a;
      k.noise(a, { dur: d + 0.05, color: 'pink', filter: 'bandpass', f: [[0, 800], [d, 1300]], q: 0.7, gain: 0.2 * gain, a: d * 0.2, hold: d * 0.6, pan, minor });
      k.play('stroke', a, { material: 'sharpie', dur: d, gain: 0.45 * gain, pan, minor });
    };
    const mark = (a, b, gain = 1, pan = 0, minor = false, material = 'marker') => {
      k.noise(a, { dur: 0.024, filter: 'bandpass', f: 1400, q: 1.2, gain: 0.24 * gain, a: 0.001, pan, minor });
      k.play('stroke', a, { material, dur: b - a, gain, pan, minor });
    };
    const tear = (t, gain = 0.8, pan = 0) => { k.noise(t, { dur: 0.03, filter: 'bandpass', f: 1500, q: 1, gain: 0.22 * gain, a: 0.001, pan, minor: true }); k.play('tape', t, { dur: 0.22, gain: gain * 1.3, pan, minor: true }); };
    const whip = (mid, top = 1500) => k.play('whoosh', mid - 0.38, { dur: 0.72, top, gain: 0.5 });

    k.bed('room', 0, D, { gain: 0.35 });
    k.music('pad', 0, D, { bpm: 72, gain: 0.22, chords: [['A3', 'C4', 'E4', 'G4'], ['F3', 'A3', 'C4', 'E4'], ['C3', 'E3', 'G3', 'B3'], ['G3', 'B3', 'D4', 'F4'], ['A3', 'C4', 'E4', 'A4']] });

    // 1 HOOK + PROBLEM
    slide(0, 0.2, 0.5, 0.3); put(LAND * 3, 0.7, 0.3, true);
    tear(X.tape0, 0.7, 0.2); tear(X.tape0 + 0.1, 0.6, 0.5);
    put(X.h1 + LAND, 1, -0.3); put(X.h2 + LAND, 1, -0.15);
    hl(X.hl0[0], X.hl0[1], 1.1, -0.2);
    k.play('whoosh', X.push[0], { dur: X.push[1] - X.push[0], top: 900, gain: 0.22 });
    put(X.signLab + LAND, 0.7, 0.1, true);
    mark(X.ring[0], X.ring[1], 1.05, 0.1);
    slide(X.old, 0.25, 0.7, 0.5, true); put(X.oldLab + LAND, 0.7, 0.4, true);
    mark(X.cross[0], (X.cross[0] + X.cross[1]) / 2, 1.3, 0.45); mark((X.cross[0] + X.cross[1]) / 2, X.cross[1], 1.3, 0.45);
    k.play('thud', X.cross[0], { f: 95, gain: 0.42, pan: 0.35 });
    k.play('error', X.cross[0] + 0.12, { f: 'D3', gain: 0.3, pan: 0.35 });
    whip(X.whip1[1]);

    // 2 WE DESIGN IT
    slide(X.card, 0.25, 0.8, 0); put(X.brandTag + LAND, 0.7, -0.1, true); tear(X.brandTag + 0.03, 0.6, 0);
    mark(X.logoRing[0], X.logoRing[1], 1.0, 0);
    put(X.mono + LAND, 1.0, 0);
    X.sw.forEach((a, i) => put(a + LAND, 0.55, -0.3 + i * 0.2, true));
    put(X.aa + LAND, 0.6, -0.15, true); put(X.aa2 + LAND, 0.6, 0.15, true);
    k.play('whoosh', X.pan1[0], { dur: X.pan1[1] - X.pan1[0], top: 1100, gain: 0.2 });
    mark(X.arr1[0], X.arr1[1], 0.6, 0.2, true, 'pen');
    slide(X.site, 0.25, 0.8, 0.3); tear(X.siteTag + 0.03, 0.6, 0.2); put(X.siteTag + LAND, 0.7, -0.1, true);
    put(X.siteHero + LAND, 0.8, 0.3); slide(X.siteHead, 0.2, 0.6, -0.2, true); put(X.siteHead + LAND * 2, 0.7, -0.2, true);
    put(X.siteBtn + LAND, 0.7, -0.2, true); hl(X.hlBtn[0], X.hlBtn[1], 0.9, -0.2);
    k.play('whoosh', X.pan2[0], { dur: X.pan2[1] - X.pan2[0], top: 1100, gain: 0.2 });
    mark(X.arr2[0], X.arr2[1], 0.6, 0.2, true, 'pen');
    put(X.poster + LAND, 1.0, -0.1); tear(X.poster + 0.1, 0.6, -0.1);
    slide(X.phone, 0.25, 0.7, 0.4, true); put(X.campTag + LAND, 0.7, 0, true);
    for (let i = 0; i < 6; i++) k.play('pop', X.hearts + i * 0.16, { f: 700 + (i % 3) * 120, gain: 0.35, pan: 0.3, minor: true });
    k.play('whoosh', X.pull[0], { dur: X.pull[1] - X.pull[0], top: 700, gain: 0.3 });
    put(X.d1 + LAND, 1.1, 0); hl(X.hlD[0], X.hlD[1], 1.1, 0);
    whip(X.whip2[1], 1300);

    // 3 IT GETS SEEN
    k.play('paper', X.new3, { gain: 0.6, minor: true }); put(X.new3 + LAND, 1.1, -0.3);
    tear(X.new3 + 0.15, 0.7, -0.4);
    slide(X.clipB, 0.25, 0.8, 0.4); tear(X.clipB + 0.15, 0.6, 0.4);
    put(X.s1 + LAND, 1.0, -0.2); hl(X.hlS[0], X.hlS[1], 1.1, -0.2);
    mark(X.ring3[0], X.ring3[1], 1.05, -0.2);
    hl(X.hlB[0], X.hlB[1], 0.9, 0.4);
    k.play('ding', X.hlB[1], { f: 'E5', gain: 0.25, pan: 0.3 });

    // 4 ZOOMI AUDIT: the sheet slides up, the result climbs, #1 is the biggest hit
    slide(X.sheet[0], X.sheet[1] - X.sheet[0] + 0.05, 1.6, 0); put(X.sheet[1], 1.1, 0);
    put(X.a1 + LAND, 0.9, -0.2); put(X.num + LAND, 0.7, -0.4, true);
    hl(X.hlA[0], X.hlA[1], 0.9, -0.2);
    for (let i = 1; i <= 4; i++) { const t = X.climb[0] + (i / 4) * (X.climb[1] - X.climb[0]); k.play('tick', t, { f: 2600 + i * 300, gain: 1.4, pan: -0.3 }); k.play('slap', t + 0.01, { gain: 0.25, pan: 0.3, minor: true }); }
    k.play('impact', X.climb[1], { gain: 0.7, pan: -0.2 });
    k.play('ding', X.climb[1] + 0.01, { f: 'A4', gain: 0.35, pan: -0.2 });
    hl(X.hlNum[0], X.hlNum[1], 1.3, -0.3); hl(X.hlRow[0], X.hlRow[1], 0.7, 0.3, true);
    whip(X.whip3[1]);

    // 5 TAKEAWAY
    put(X.k1 + LAND, 1.0, -0.1); put(X.k2 + LAND, 1.2, -0.1);
    hl(X.hlK[0], X.hlK[1], 1.2, -0.1);
    mark(X.arrK[0], X.arrK[1], 0.9, 0.3, true, 'sharpie');
    put(X.url + LAND, 1.0, 0.35);
    k.play('success', X.url + 0.12, { f: 'A4', gain: 0.4 });
  };

  window.ZX = { X, DURATION, draw: drawExplainer, camAt, scoreSound };
})();

</script>
<script>
(() => {
  const DURATION = ZX.DURATION, scoreSound = ZX.scoreSound;
  window.DURATION = DURATION; window.scoreSound = scoreSound;
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const playB = document.getElementById('play'), scrub = document.getElementById('scrub'), timeE = document.getElementById('time'), sndB = document.getElementById('snd'), loopB = document.getElementById('loop');
  let t = 0, playing = false, t0 = 0, w0 = 0, stopSound = null, sound = true, loop = true, ready = false, raf = 0;
  const draw = (tt) => { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none'; ctx.clearRect(0, 0, 1280, 720); ZX.draw(ctx, tt); };
  const ui = () => { scrub.value = Math.round(t / DURATION * 1000); timeE.textContent = `${t.toFixed(1)} / ${DURATION.toFixed(1)} s`; playB.textContent = playing ? 'Pause' : 'Play'; };
  const stopS = () => { if (stopSound) { stopSound(); stopSound = null; } };
  const startS = () => { stopS(); if (sound && playing) stopSound = SOUND.live(scoreSound, t, { voiceover: false }); };
  window.seek = (tt) => { t = Math.max(0, Math.min(DURATION, tt)); draw(t); ui(); };
  const frame = (now) => {
    if (!playing) return;
    t = t0 + (now - w0) / 1000;
    if (t >= DURATION) { if (loop) { t = 0; t0 = 0; w0 = now; startS(); } else { t = DURATION; playing = false; stopS(); } }
    draw(t); ui(); raf = requestAnimationFrame(frame);
  };
  const play = () => { if (!ready) return; if (t >= DURATION) t = 0; playing = true; t0 = t; w0 = performance.now(); startS(); ui(); cancelAnimationFrame(raf); raf = requestAnimationFrame(frame); };
  const pause = () => { playing = false; cancelAnimationFrame(raf); stopS(); ui(); };
  playB.onclick = () => (playing ? pause() : play());
  scrub.oninput = () => { const was = playing; pause(); window.seek(scrub.value / 1000 * DURATION); if (was) play(); };
  sndB.onclick = () => { sound = !sound; sndB.setAttribute('aria-pressed', sound); sndB.textContent = sound ? 'Sound on' : 'Sound off'; if (sound) startS(); else stopS(); };
  loopB.onclick = () => { loop = !loop; loopB.setAttribute('aria-pressed', loop); };
  window.ready = (async () => {
    const specs = ['400 80px "Anton"', '700 30px "Oswald"', '400 13px "Oswald"', '700 34px "Libre Baskerville"', '400 10px "Libre Baskerville"', 'italic 400 19px "Libre Baskerville"', 'italic 700 19px "Libre Baskerville"'];
    try { await Promise.all(specs.map((f) => document.fonts.load(f, 'AaZz09'))); await document.fonts.ready; } catch (e) {}
    ready = true; window.seek(0); return true;
  })();
})();
</script>
