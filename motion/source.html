<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@700;800&family=Newsreader:ital,opsz,wght@1,6..72,300&display=swap" rel="stylesheet">
<style>
:root{--paper:#f2efe7;--ink:#11110f;--coral:#ff553e;--blue:#5b72ff;--yellow:#e9ff47;--pink:#f4a9d4;--green:#76d5ad}
html,body{margin:0;width:720px;height:1280px;overflow:hidden}
#stage{position:relative;width:720px;height:1280px;overflow:hidden;background:
 linear-gradient(rgba(17,17,15,.16) 2px,transparent 2px),linear-gradient(90deg,rgba(17,17,15,.16) 2px,transparent 2px),var(--blue);background-size:64px 64px}
.shape{position:absolute;left:50%;top:44%;width:560px;height:560px;margin:-280px 0 0 -280px;background:var(--coral)}
.sun{position:absolute;width:520px;height:520px;border-radius:50%;background:var(--yellow)}
.ring{position:absolute;left:70px;top:230px;width:580px;height:580px;box-sizing:border-box;border:26px solid var(--ink);border-right-color:transparent;border-radius:50%}
.word{position:absolute;left:44px;right:44px;bottom:210px;height:230px;overflow:hidden}
.word span{position:absolute;left:0;bottom:0;color:var(--paper);font-family:Newsreader;font-style:italic;font-weight:300;font-size:220px;letter-spacing:-.06em;line-height:1;white-space:nowrap}
.z{position:absolute;left:50%;top:44%;color:var(--paper);font-family:Manrope;font-weight:800;font-size:520px;letter-spacing:-.12em;line-height:.72;transform:translate(-54%,-50%)}
.label{position:absolute;left:44px;bottom:150px;font-family:'DM Mono';font-size:26px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.bar{position:absolute;left:44px;right:44px;bottom:120px;height:4px;background:rgba(17,17,15,.25)}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
</style></head><body><div id="stage">
<div class="sun" id="sun"></div><div class="shape" id="shape"></div><div class="ring" id="ring"></div>
<div class="z" id="z">Z</div>
<div class="word" id="word"></div>
<div class="label" id="label"></div><div class="bar"><i id="bar"></i></div>
</div>
<script>
const W=[['Brand.','#ff553e'],['Web.','#f4a9d4'],['Campaigns.','#ff553e'],['Search.','#76d5ad']];
// border radii (tl tr br bl) in px for each segment shape
const R=[[280,280,280,280],[280,280,0,0],[40,40,40,40],[280,0,280,0]];
const ROT=[0,0,-24,45];
const SEG=2.25, N=4, T=SEG*N;
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const lerp=(a,b,k)=>a+(b-a)*k;
function hex(h){return [1,3,5].map(i=>parseInt(h.slice(i,i+2),16))}
const wordEl=document.getElementById('word');
W.forEach(([w])=>{const s=document.createElement('span');s.textContent=w;wordEl.appendChild(s)});
const spans=[...wordEl.children];
spans.forEach(sp=>{const w=sp.getBoundingClientRect().width; if(w>632) sp.style.fontSize=(220*632/w)+'px';});
window.render=function(t){
  t=((t%T)+T)%T;
  const i=Math.floor(t/SEG), local=t-i*SEG, j=(i+1)%N;
  const tr=Math.min(1,Math.max(0,(local-(SEG-0.6))/0.6)); const k=ease(tr);
  // shape morph
  const r=R[i].map((v,n)=>lerp(v,R[j][n],k)); const rot=lerp(ROT[i],ROT[j]+(j===0&&i===N-1?0:0),k);
  const c1=hex(W[i][1]),c2=hex(W[j][1]); const c=c1.map((v,n)=>Math.round(lerp(v,c2[n],k)));
  const sh=document.getElementById('shape');
  sh.style.borderRadius=r.map(v=>v+'px').join(' ');
  sh.style.background=`rgb(${c})`;
  const bob=Math.sin(t/T*2*Math.PI)*14;
  sh.style.transform=`translateY(${bob}px) rotate(${rot}deg) scale(${1-0.08*Math.sin(Math.PI*tr)})`;
  // sun orbits once per loop
  const a=t/T*2*Math.PI; document.getElementById('sun').style.transform=`translate(${600+Math.cos(a)*70-260}px,${300+Math.sin(a)*90-260}px) scale(.62)`;
  // ring spins once per loop
  document.getElementById('ring').style.transform=`rotate(${t/T*360}deg)`;
  // Z gentle breathe
  document.getElementById('z').style.transform=`translate(-54%,-50%) scale(${1+0.025*Math.sin(a*2)})`;
  // words: current slides out up during transition, next slides in from below
  spans.forEach((s,n)=>{let y=260;
    if(n===i) y=lerp(0,-260,k);
    if(n===j) y=lerp(260,0,k);
    if(n===i && local<0.0001 && false) y=0;
    s.style.transform=`translateY(${y}px)`;});
  document.getElementById('label').textContent=`Zoomi / 0${(k>0.5?j:i)+1} — 04`;
  document.getElementById('bar').style.width=((t/T)*100)+'%';
};
render(0);
</script></body></html>
