name: Audit checks
on:
  pull_request:
    paths: ['audit/**', '.github/workflows/audit-checks.yml']
  push:
    branches: [main]
    paths: ['audit/**', '.github/workflows/audit-checks.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: audit/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
